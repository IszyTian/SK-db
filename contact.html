<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukuma Fresh - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🥬 Sukuma Fresh</div>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="sales.html">Flash Sales</a>
            <a href="register.html">Register</a>
            <a href="contact.html" class="active">Contact</a>
            <a href="login.html" >Login</a>
        </nav>
        <div class="cart-icon" id="cart-toggle">🛒 Cart (<span id="cart-count">0</span>)</div>
    </header>

    <main class="page-section">
        <div class="form-container">
            <h2>Contact Our Team</h2>
            <form id="contact-form">
                <label>Name</label><input type="text" name="name" required>
               <label>Email</label><input type="email" name="email" required>
                <label>Message Details</label><textarea name="message" rows="4" required></textarea>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </main>

    <!-- Sidebar Cart Module -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header"><h3>Your Shopping Cart</h3><span class="close-cart" id="close-cart">&times;</span></div>
        <div id="cart-items-container"></div>
        <div class="cart-summary"><h4>Total: KES <span id="cart-total-price">0</span></h4><button class="btn" id="open-checkout">Checkout</button></div>
    </div>

    <div class="modal" id="checkout-modal">
        <div class="modal-content"><span class="close-modal" id="close-modal">&times;</span><form id="checkout-form"><label>Address</label><input type="text" required><button type="submit" class="btn">Order</button></form></div>
    </div>

    <footer><p>&copy; 2026 Sukuma Fresh. All Rights Reserved.</p></footer>
    <script src="script1.js"></script>
</body>
</html>
